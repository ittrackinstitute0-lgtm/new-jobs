name: Daily Jobs AI Verification & Update

on:
  schedule:
    # Runs daily at 06:00 UTC (11:00 AM Pakistan Standard Time)
    - cron: '0 6 * * *'
  # Allows you to run it manually anytime from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Gemini AI Job Verification Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_verify_jobs.py

      - name: Commit and Push Verified Jobs to Website
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "RozgarPK AI Agent"
          git add js/jobs-data.js
          if git diff --staged --quiet; then
            echo "No new jobs changes to commit."
          else
            git commit -m "Auto: Added newly verified daily jobs across Pakistan [skip ci]"
            git push origin main
          fi
